overwrite: true
schema: "https://portal.graphlit.io/api/v1/graphql"
documents: "./src/documents/**/*.graphql"
generates:
  ./src/generated/graphql-types.ts:
    plugins:
      - "typescript"
      - "typescript-operations"
    config:
      withComponent: false
      withHOC: false
      withHooks: false
  ./src/generated/graphql-documents.ts:
    plugins:
      - "typescript-document-nodes"
