type Query @authorize @authorize @authorize @authorize @authorize {
  "Fetch logged-in organization."
  organization: Organization @cost(weight: "10")
  "Lookup an organization given its ID."
  organizationById(id: ID!): Organization @cost(weight: "10")
  "Lookup an organization given its Clerk identifier."
  organizationByIdentifier(identifier: String!): Organization
    @cost(weight: "10")
  "Retrieves organizations based on the provided filter criteria."
  organizations(filter: OrganizationFilter): OrganizationResults
    @cost(weight: "10")
  "Get organization billing session details."
  organizationBillingSession(sessionId: ID!): OrganizationBilling
    @cost(weight: "10")
  "Lists API keys for the organization."
  listApiKeys: [ApiKeyMetadata] @cost(weight: "10")
  "Retrieves Stripe products."
  products: ProductResults @cost(weight: "10")
  "Lookup a project given its ID."
  project("ID of the project." id: ID!): Project @cost(weight: "10")
  "Retrieves projects based on the provided filter criteria."
  projects(
    "The filter criteria to apply when retrieving projects."
    filter: ProjectFilter
  ): ProjectResults @cost(weight: "10")
  "Retrieves supported project regions."
  projectRegions: ProjectRegion @cost(weight: "10")
  "Fetch logged-in user."
  user: User @cost(weight: "10")
  "Lookup a user given its ID."
  userById(id: ID!): User @cost(weight: "10")
  "Lookup a user given its Clerk identifier."
  userByIdentifier(identifier: String!): User @cost(weight: "10")
  "Retrieves users based on the provided filter criteria."
  users(filter: UserFilter): UserResults @cost(weight: "10")
}

