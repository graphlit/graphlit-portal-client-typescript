  LAST_DURING_PERIOD
  "Last Ever"
  LAST_EVER
  "Maximum"
  MAXIMUM
  "Sum"
  SUM
}

"Defines when a policy shall be executed."
enum ApplyPolicy {
  "Before the resolver was executed."
  BEFORE_RESOLVER
  "After the resolver was executed."
  AFTER_RESOLVER
  "The policy is applied in the validation step before the execution."
  VALIDATION
}

enum BankAccountHolderTypes {
  "Company"
  COMPANY
  "Individual"
  INDIVIDUAL
}

enum BankAccountTypes {
  "Checking"
  CHECKING
  "Savings"
  SAVINGS
}

