}

type Mutation @authorize {
  "Creates a project environment."
  createEnvironment(
    "The properties for the new project environment."
    environment: EnvironmentInput!
  ): Environment @cost(weight: "10")
  "Updates a project environment."
  updateEnvironment(
    "The updated properties for the project environment."
    environment: EnvironmentUpdateInput!
  ): Environment @cost(weight: "10")
  "Regenerates the JWT signing secret for a project environment."
  regenerateEnvironmentSecret(
    "The ID of the environment."
    id: ID!
  ): Environment @cost(weight: "10")
  "Generates a project environment token for accessing the Data API."
  generateEnvironmentToken(
    "The ID of the environment."
    id: ID!
    "The authorization role assigned to the token."
    role: RoleTypes
  ): EnvironmentToken @cost(weight: "10")
  "Deletes a project environment."
  deleteEnvironment("The ID of the environment." id: ID!): Environment
    @cost(weight: "10")
  "Fixes an organization."
  fixOrganization("The ID of the organization." id: ID!): Organization
    @cost(weight: "10")
  "Setup organization billing."
  setupOrganizationBilling(
    successUri: URL!
    cancelUri: URL!
  ): OrganizationBilling @cost(weight: "10")
  "Creates a new API key for programmatic access."
  createApiKey("The name for the API key." name: String!): ApiKeyCreated
    @cost(weight: "10")
  "Revokes an API key."
  revokeApiKey("The ID of the API key to revoke." keyId: String!): Organization
    @cost(weight: "10")
  "Creates a project."
  createProject(
    "The properties for the new project."
    project: ProjectInput!
  ): Project @cost(weight: "10")
  "Updates a project."
  updateProject(
    "The updated properties for the project."
    project: ProjectUpdateInput!
  ): Project @cost(weight: "10")
  "Fix a project."
  fixProject(
    "The ID of the project."
    id: ID!
    "The ID of the organization."
    organizationId: ID!
  ): Project @cost(weight: "10")
  "Deletes a project."
  deleteProject("The ID of the project." id: ID!): Project @cost(weight: "10")
  "Disables a project."
  disableProject("The ID of the project." id: ID!): Project @cost(weight: "10")
  "Enables a project."
  enableProject("The ID of the project." id: ID!): Project @cost(weight: "10")
  "Updates a project subscription."
  updateProjectSubscription(
    "The ID of the project."
    id: ID!
    "The Stripe product identifier."
    productIdentifier: String!
  ): Project @cost(weight: "10")
}

"Represents an organization."
type Organization {
  "The ID of the organization."
  id: ID!
  "The name of the organization."
  name: String!
  "The owner of the organization."
  owner: Owner!
  "The state of the organization (i.e. created, finished)."
  state: EntityState!
  "The relevance score of the organization."
  relevance: Float
  "The creation date of the organization."
  creationDate: DateTime!
  "The modified date of the organization."
  modifiedDate: DateTime
  "The external identifier of the organization."
  identifier: String
  "The description of the organization."
  description: String
  "The billing identifier of the organization."
  billingIdentifier: String
  "The billing email of the organization."
  billingEmail: String
  "The organization project quota limits."
  quota: OrganizationQuota
  "The API keys for programmatic access."
  apiKeys: [ApiKeyMetadata] @authorize
  "The organization payment methods."
  paymentMethods: [PaymentMethod] @cost(weight: "10")
  "The users that are members of the organization."
  users: [User] @cost(weight: "10")
  "The user memberships associated with the organization."
  memberships: [Membership] @cost(weight: "10")
  "The projects associated with the organization."
  projects: [Project] @cost(weight: "10")
}

