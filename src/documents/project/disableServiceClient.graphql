mutation DisableServiceClient($id: ID!, $clientId: String!) {
  disableServiceClient(id: $id, clientId: $clientId) {
    id
    name
    type
    state
    jwtSecret
    uri
    serviceClients {
      name
      clientId
      scopes
      role
      state
      createdAt
      keys {
        name
        kid
        kty
        alg
        use
        publicJwk
        publicKeyFingerprint
        state
        createdAt
      }
    }
  }
}
