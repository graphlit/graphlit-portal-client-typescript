mutation DisableServiceClientKey($id: ID!, $clientId: String!, $kid: String!) {
  disableServiceClientKey(id: $id, clientId: $clientId, kid: $kid) {
    id
    name
    type
    state
    jwtSecret
    uri
    serviceClients {
      name
      clientId
      scopes
      role
      state
      createdAt
      keys {
        name
        kid
        kty
        alg
        use
        publicJwk
        publicKeyFingerprint
        state
        createdAt
      }
    }
  }
}
